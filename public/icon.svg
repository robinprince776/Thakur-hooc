<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Metallic Bezel Outer -->
    <linearGradient id="omniBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="25%" stop-color="#374151"/>
      <stop offset="60%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>

    <!-- Glowing Radioactive Green Core -->
    <radialGradient id="greenCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7FEE7"/>
      <stop offset="25%" stop-color="#BEF264"/>
      <stop offset="65%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </radialGradient>

    <!-- Node Glow -->
    <radialGradient id="nodeGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#BEF264"/>
      <stop offset="75%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>

    <!-- Left & Right Charcoal Wedges -->
    <linearGradient id="wedgeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="wedgeRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Glass Dial Clip Path -->
    <clipPath id="dialClip">
      <circle cx="256" cy="256" r="140"/>
    </clipPath>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Dark Card Backing -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#22c55e" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Outer Energy Aura -->
  <circle cx="256" cy="256" r="215" fill="#84cc16" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- OUTER HOUSING: Titanium / Gunmetal Bezel -->
  <circle cx="256" cy="256" r="215" fill="url(#omniBezel)" stroke="#4B5563" stroke-width="8"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="#1F2937" stroke-width="6" stroke-dasharray="70 20"/>
  <circle cx="256" cy="256" r="185" fill="#0B0F17" stroke="#374151" stroke-width="5"/>
  <circle cx="256" cy="256" r="160" fill="#181B22" stroke="#1F242D" stroke-width="4"/>

  <!-- CORE GLASS FACEPLATE -->
  <g clip-path="url(#dialClip)">
    <!-- Radioactive Green Luminous Disc -->
    <circle cx="256" cy="256" r="140" fill="url(#greenCore)" filter="url(#neonGlow)"/>

    <!-- High-tech concentric grid lines -->
    <circle cx="256" cy="256" r="110" fill="none" stroke="#bef264" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>
    <circle cx="256" cy="256" r="75" fill="none" stroke="#bef264" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 8"/>

    <!-- LEFT DARK CHARCOAL TRIANGULAR WEDGE -->
    <path d="M 116 116 L 256 250 L 116 396 L 96 256 Z" fill="url(#wedgeLeft)" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>
    <!-- Left Wedge Bevel Highlight & Shadow -->
    <path d="M 116 116 L 256 250" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/>
    <path d="M 256 250 L 116 396" stroke="#030712" stroke-width="6" stroke-linecap="round"/>

    <!-- RIGHT DARK CHARCOAL TRIANGULAR WEDGE -->
    <path d="M 396 116 L 256 262 L 396 396 L 416 256 Z" fill="url(#wedgeRight)" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>
    <!-- Right Wedge Bevel Highlight & Shadow -->
    <path d="M 396 116 L 256 262" stroke="#6B7280" stroke-width="5" stroke-linecap="round"/>
    <path d="M 256 262 L 396 396" stroke="#030712" stroke-width="6" stroke-linecap="round"/>

    <!-- Center Pinch Joint -->
    <rect x="251" y="246" width="10" height="20" fill="#111827"/>

    <!-- DIAGONAL SPECULAR GLASS SHEEN STREAKS -->
    <polygon points="174,100 214,100 306,412 266,412" fill="#FFFFFF" fill-opacity="0.22"/>
    <polygon points="224,100 240,100 342,412 326,412" fill="#FFFFFF" fill-opacity="0.32"/>
    <polygon points="260,100 268,100 364,412 356,412" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>

  <!-- Inner Bezel Ring Retainer Border -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1F2937" stroke-width="6"/>

  <!-- 4 GLOWING POWER NODES (12, 3, 6, 9 O'CLOCK) -->
  <!-- Node Top (12 o'clock) -->
  <g>
    <circle cx="256" cy="46" r="34" fill="#1F2937" stroke="#4B5563" stroke-width="5"/>
    <circle cx="256" cy="46" r="25" fill="#0B0F17"/>
    <circle cx="256" cy="46" r="20" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>
    <circle cx="251" cy="41" r="5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Node Right (3 o'clock) -->
  <g>
    <circle cx="466" cy="256" r="34" fill="#1F2937" stroke="#4B5563" stroke-width="5"/>
    <circle cx="466" cy="256" r="25" fill="#0B0F17"/>
    <circle cx="466" cy="256" r="20" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>
    <circle cx="461" cy="251" r="5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Node Bottom (6 o'clock) -->
  <g>
    <circle cx="256" cy="466" r="34" fill="#1F2937" stroke="#4B5563" stroke-width="5"/>
    <circle cx="256" cy="466" r="25" fill="#0B0F17"/>
    <circle cx="256" cy="466" r="20" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>
    <circle cx="251" cy="461" r="5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Node Left (9 o'clock) -->
  <g>
    <circle cx="46" cy="256" r="34" fill="#1F2937" stroke="#4B5563" stroke-width="5"/>
    <circle cx="46" cy="256" r="25" fill="#0B0F17"/>
    <circle cx="46" cy="256" r="20" fill="url(#nodeGlow)" filter="url(#neonGlow)"/>
    <circle cx="41" cy="251" r="5" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
